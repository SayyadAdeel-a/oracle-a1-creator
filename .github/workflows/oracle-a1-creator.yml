name: Oracle A1.Flex Instance Creator

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-a1-creator
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  create-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI SDK
        run: python -m pip install --upgrade oci

      - name: Run A1.Flex creator
        id: creator
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python github_actions_oracle_a1.py

      - name: Disable workflow after instance is found
        if: always() && steps.creator.outputs.instance_found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable oracle-a1-creator.yml --repo "$GITHUB_REPOSITORY"

      - name: Record workflow failure
        if: failure()
        run: |
          echo "## Oracle A1.Flex creator failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the creator step logs and configured GitHub Actions Secrets. Scheduled runs will retry unless the workflow was disabled after an instance was found." >> "$GITHUB_STEP_SUMMARY"
